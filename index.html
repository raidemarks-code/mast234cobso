<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>Master System Arcade</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#eef4ff}
header{padding:22px max(20px,4vw);background:linear-gradient(110deg,#10264a,#14162e);border-bottom:2px solid #16baf7;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;color:#6be2ff;font-size:clamp(20px,3vw,36px)}header p{margin:5px 0;color:#a9c0d9}.top-tag{color:#a9c0d9;font-size:13px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 100px)}
aside{padding:20px;background:#10192b;border-right:1px solid #293c5b}aside h2{font-size:16px;margin:0 0 18px}
.categorias{display:block}.categoria{display:block;width:100%;border:0;border-radius:9px;text-align:left;padding:12px;margin:6px 0;background:#1b2a43;color:#e8f4ff;cursor:pointer;font-size:15px}
.categoria:hover,.categoria.ativa{background:#116a9e}main{padding:25px;min-width:0}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
input{padding:12px 14px;width:min(100%,340px);background:#131f32;color:white;border:1px solid #355579;border-radius:10px;font-size:16px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.card{background:#14233a;border:1px solid #29466b;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;color:white;padding:0;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#4bcaff}
.capa{height:160px;width:100%;object-fit:cover;display:block;background:#172b48}
.sem-capa{height:160px;display:grid;place-items:center;background:linear-gradient(135deg,#123e65,#261849);font-size:54px}
.info{padding:13px}.info strong{display:block;font-size:17px;margin-bottom:6px}.info small{color:#93b8da}
.play{display:inline-block;margin-top:12px;color:#5bdbff;font-weight:bold}.nota{color:#a6bdd7;line-height:1.6;font-size:14px}
.btn{border:0;border-radius:9px;padding:12px 16px;background:#0b83ba;color:white;font-weight:700;cursor:pointer;font-size:15px}
#view-player{display:none;height:100vh;height:100dvh;flex-direction:column;background:#000}
#barra{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#10192b;border-bottom:1px solid #293c5b}
#barra span{font-weight:700;color:#6be2ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#game{flex:1;min-height:0;width:100%;background:#000;position:relative}
#status{padding:10px 12px;color:#ffcf8a;font-size:14px;line-height:1.5;word-break:break-word;background:#10192b;max-height:30vh;overflow:auto}
#status:empty{display:none}
body.modo-player header,body.modo-player #view-biblioteca{display:none}
body.modo-player #view-player{display:flex}
@media(max-width:700px){.layout{display:block}aside{border-right:0;border-bottom:1px solid #293c5b;padding:14px}.categorias{display:flex;overflow:auto;gap:8px}.categoria{white-space:nowrap;width:auto;flex:0 0 auto}main{padding:16px}.grade{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.capa,.sem-capa{height:125px}}
</style>
</head>
<body>

<header>
  <div>
    <h1>MASTER SYSTEM ARCADE</h1>
    <p>Biblioteca visual de jogos Sega Master System</p>
  </div>
  <span class="top-tag">ROM .SMS + .BIN</span>
</header>

<div id="view-biblioteca" class="layout">
  <aside>
    <h2>CATEGORIAS</h2>
    <nav id="categorias" class="categorias" aria-label="Categorias"></nav>
  </aside>
  <main>
    <div class="topo">
      <h2 id="cabecalho">Todos os jogos</h2>
      <input id="busca" placeholder="Pesquisar jogo..." aria-label="Pesquisar jogo">
    </div>
    <div id="grade" class="grade"></div>
    <p id="mensagem" class="nota"></p>
  </main>
</div>

<div id="view-player">
  <div id="barra">
    <button class="btn" onclick="voltar()">← VOLTAR</button>
    <span id="titulo-jogo"></span>
    <button class="btn" onclick="telaCheia()">TELA CHEIA</button>
  </div>
  <div id="game"></div>
  <div id="status"></div>
</div>

<script>
const dadosJogos = [
  {
    "nome": "mastersystem1",
    "categoria": "aventura",
    "arquivo": "jogos/aventura/alexkiddmiracle.sms",
    "imagem": "jogos/aventura/alexkiddmiracle.png"
  },
  {
    "nome": "mastersystem1",
    "categoria": "acao",
    "arquivo": "jogos/acao/alexkiddmiracle.sms",
    "imagem": "jogos/acao/alexkiddmiracle.png"
  },
  {
    "nome": "mastersystem222",
    "categoria": "corrida",
    "arquivo": "jogos/corrida/alexkiddmiracle.sms",
    "imagem": "jogos/corrida/alexkiddmiracle.png"
  }
];

let jogos = dadosJogos, categoriaAtual = 'Todos';
const $ = id => document.getElementById(id);
const texto = s => String(s || '');
const urlAbs = c => new URL(encodeURI(c), window.location.href).href;
const status = m => { $('status').textContent = m; };

function categorias() {
  const nomes = ['Todos', ...new Set(jogos.map(j => j.categoria || 'Outros'))];
  $('categorias').innerHTML = '';
  nomes.forEach(nome => {
    const b = document.createElement('button');
    b.className = 'categoria' + (categoriaAtual === nome ? ' ativa' : '');
    b.textContent = (nome === 'Todos' ? '🕹️ ' : '📁 ') + nome;
    b.onclick = () => { categoriaAtual = nome; categorias(); render(); };
    $('categorias').append(b);
  });
}

function render() {
  const termo = $('busca').value.trim().toLocaleLowerCase('pt-BR');
  $('cabecalho').textContent = categoriaAtual === 'Todos' ? 'Todos os jogos' : categoriaAtual;
  $('grade').innerHTML = '';
  const lista = jogos.filter(j => (categoriaAtual === 'Todos' || (j.categoria || 'Outros') === categoriaAtual) && texto(j.nome).toLocaleLowerCase('pt-BR').includes(termo));

  lista.forEach(j => {
    const b = document.createElement('button');
    b.className = 'card';
    const capa = document.createElement('div');
    capa.className = 'sem-capa';
    capa.textContent = '🎮';
    if (j.imagem && /\.(png|jpe?g|webp)$/i.test(j.imagem)) {
      const img = document.createElement('img');
      img.className = 'capa';
      img.alt = 'Capa de ' + j.nome;
      img.loading = 'lazy';
      img.src = urlAbs(j.imagem);
      img.onerror = () => img.replaceWith(capa);
      b.append(img);
    } else b.append(capa);

    const info = document.createElement('div');
    info.className = 'info';
    const nome = document.createElement('strong');
    nome.textContent = j.nome;
    const cat = document.createElement('small');
    cat.textContent = (j.categoria || 'Outros') + ' • ' + j.arquivo.split('.').pop().toUpperCase();
    const play = document.createElement('div');
    play.className = 'play';
    play.textContent = 'JOGAR';
    info.append(nome, cat, play);
    b.append(info);

    // Abre o jogo em uma página nova e limpa (melhor para celular)
    b.onclick = () => {
      location.href = location.pathname + '?rom=' + encodeURIComponent(j.arquivo) + '&nome=' + encodeURIComponent(j.nome);
    };
    $('grade').append(b);
  });
  $('mensagem').textContent = lista.length ? '' : 'Nenhum jogo encontrado.';
}

function voltar() { location.href = location.pathname; }

function telaCheia() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn) { try { fn.call(el); } catch (e) {} }
}

async function iniciarPlayer(rom, nome) {
  document.body.classList.add('modo-player');
  $('titulo-jogo').textContent = nome;
  document.title = nome + ' - Master System Arcade';
  const url = urlAbs(rom);

  status('Verificando ROM...');
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) {
      status('ROM não encontrada (erro ' + r.status + '): ' + url +
        '\nConfira se o nome e a pasta no GitHub estão IGUAIS ao código (maiúsculas, minúsculas e extensão).');
      return;
    }
    const buf = await r.arrayBuffer();
    if (buf.byteLength < 1024) {
      status('O arquivo da ROM veio vazio ou muito pequeno (' + buf.byteLength + ' bytes). Reenvie a ROM para o GitHub.');
      return;
    }
  } catch (e) {
    status('Não foi possível baixar a ROM: ' + e.message);
    return;
  }

  status('Carregando emulador...');
  window.EJS_player = '#game';
  window.EJS_core = 'segaMS';
  window.EJS_gameUrl = url;
  window.EJS_gameName = nome;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = false;   // mostra o botão de play (necessário para o som no celular)
  window.EJS_volume = 0.5;
  window.EJS_threads = false;
  window.EJS_ready = () => status('');
  window.EJS_onGameStart = () => status('');

  const s = document.createElement('script');
  s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = () => status('Não foi possível carregar o emulador (cdn.emulatorjs.org). Verifique sua internet ou se algum bloqueador de anúncios/DNS está bloqueando.');
  document.body.appendChild(s);

  setTimeout(() => {
    if ($('status').textContent === 'Carregando emulador...') {
      status('O emulador está demorando. Aguarde mais um pouco; se não aparecer o botão de play, atualize a página e tente de novo.');
    }
  }, 15000);
}

window.addEventListener('error', e => {
  if (document.body.classList.contains('modo-player')) status('Erro: ' + e.message);
});

$('busca').oninput = render;

(function init() {
  const p = new URLSearchParams(location.search);
  if (p.get('rom')) {
    iniciarPlayer(p.get('rom'), p.get('nome') || 'Jogo');
  } else {
    categorias();
    render();
  }
})();
</script>
</body>
</html>
